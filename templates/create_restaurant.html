<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нов ресторант</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="dashboard-page">

    <div class="header">
        <div class="brand-wrap">
            <div class="brand-icon">➕</div>
            <h1>Създай нов ресторант</h1>
        </div>

        <div class="header-actions">
            <a class="top-btn" href="/restaurants">🏪 Ресторанти</a>
            <a class="top-btn" href="/dashboard">📊 Dashboard</a>
            <a class="top-btn" href="/users">👥 Потребители</a>
            <a class="top-btn" href="/menu-manager">📋 Меню</a>
            <a class="top-btn" href="/settings">⚙️ Настройки</a>
            <a class="logout-btn" href="/logout">🚪 Изход</a>
        </div>
    </div>

    <div class="container">

        {% if error %}
        <div class="error" style="margin-bottom: 18px;">{{ error }}</div>
        {% endif %}

        {% if success %}
        <div class="saved-banner" style="margin-bottom: 18px;">{{ success }}</div>
        {% endif %}

        <div class="saved-banner" style="margin-bottom: 18px;">
            🔒 Само super_admin може да създава нови ресторанти и да избира плана им.
        </div>

        <div class="settings-card">
            <h2>Данни за ресторанта</h2>

            <form method="POST" action="/create-restaurant">
                <div class="settings-grid">
                    <div class="settings-field">
                        <label>Име на ресторанта</label>
                        <input type="text" name="restaurant_name" required>
                    </div>

                    <div class="settings-field">
                        <label>Slug</label>
                        <input type="text" name="slug" placeholder="primer-restorant" required>
                    </div>

                    <div class="settings-field">
                        <label>Потребителско име</label>
                        <input type="text" name="username" required>
                    </div>

                    <div class="settings-field">
                        <label>Парола</label>
                        <input type="text" name="password" required>
                    </div>

                    <div class="settings-field">
                        <label>Макс. капацитет</label>
                        <input type="number" name="max_capacity" value="20" required>
                    </div>

                    <div class="settings-field">
                        <label>Отваря в</label>
                        <input type="number" name="open_hour" value="10" required>
                    </div>

                    <div class="settings-field">
                        <label>Затваря в</label>
                        <input type="number" name="close_hour" value="22" required>
                    </div>

                    <div class="settings-field">
                        <label>План</label>
                        <select name="plan" required>
                            <option value="basic">Basic</option>
                            <option value="standard">Standard</option>
                            <option value="premium" selected>Premium</option>
                        </select>
                    </div>
                </div>

                <div class="settings-card" style="margin-top: 20px; background: rgba(255,255,255,0.65);">
                    <h2 style="margin-bottom: 14px;">Какво включва всеки план</h2>

                    <div class="settings-grid">
                        <div class="settings-field">
                            <label>Basic</label>
                            <textarea readonly style="min-height: 140px;">• Widget
• Меню
• Контакти
• Базови резервации
• Dashboard
• Export
• Без AI chat
• Без upsell</textarea>
                        </div>

                        <div class="settings-field">
                            <label>Standard</label>
                            <textarea readonly style="min-height: 140px;">• Всичко от Basic
• AI chat
• По-умни отговори за менюто
• Better fallback
• Smart food answers
• Без premium analytics
• Без upsell</textarea>
                        </div>

                        <div class="settings-field">
                            <label>Premium</label>
                            <textarea readonly style="min-height: 140px;">• Всичко от Standard
• Upsell логика
• Premium analytics
• Advanced AI logic
• Recommended dishes
• Priority features</textarea>
                        </div>
                    </div>
                </div>

                <div class="settings-actions">
                    <button class="save-settings-btn" type="submit">🚀 Създай ресторант</button>
                </div>
            </form>
        </div>

    </div>

</body>
</html>
